---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS / Idris2 latest
    runs-on: macos-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          brew install chezscheme gmp

          command -v scheme
          scheme --version

          command -v cc
          cc --version

          uname -a
          uname -m

      - name: Install Idris2 and Pack
        run: |
          set -euxo pipefail

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/stefan-hoeck/idris2-pack/main/install.bash)"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          command -v idris2
          idris2 --version

          command -v pack
          pack help >/dev/null

      - name: Show environment
        run: |
          set -euxo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          echo "PATH=$PATH"

          echo "Idris2:"
          command -v idris2
          idris2 --version

          echo "Pack:"
          command -v pack

          echo "Chez:"
          command -v scheme
          scheme --version

          echo "Compiler:"
          command -v cc
          cc --version

          echo "System:"
          uname -a
          uname -m

      - name: Build async-kqueue
        run: |
          set -euxo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          pack --no-prompt cleanbuild

      - name: Build tests
        run: |
          set -euxo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          cd test
          pack --no-prompt cleanbuild

      - name: Run tests
        run: |
          set -euxo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          cd test

          export DYLD_LIBRARY_PATH="$(pack libs-path)"
          echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH"

          pack run
