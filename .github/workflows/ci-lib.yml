---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS / Idris2 latest
    runs-on: macos-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install chezscheme coreutils gmp

      - name: Install pack
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/stefan-hoeck/idris2-pack/main/install.bash)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build async-kqueue
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pack --no-prompt install async-kqueue

      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd test
          pack --no-prompt cleanbuild
          pack run

