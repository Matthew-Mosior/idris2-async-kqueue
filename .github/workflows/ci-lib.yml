---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS / Idris2 latest
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -euxo pipefail
          brew install gmp llvm lld
          LLVM_PREFIX="$(brew --prefix llvm)"
          LLD_PREFIX="$(brew --prefix lld)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$LLD_PREFIX/bin" >> "$GITHUB_PATH"
          PATH="$LLD_PREFIX/bin:$LLVM_PREFIX/bin:$PATH"
          export PATH
          uname -a
          uname -m
      - name: Build and install Chez Scheme
        run: |
          set -euxo pipefail
          git clone --depth=1 \
            https://github.com/cisco/ChezScheme.git \
            /tmp/ChezScheme
          cd /tmp/ChezScheme
          ./configure \
            --threads \
            --installprefix="$HOME/.local"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH"
          export PATH
      - name: Install Idris2 and Pack
        run: |
          set -euxo pipefail
          PATH="$HOME/.local/bin:$PATH"
          export PATH
          git clone --depth=1 \
            https://github.com/stefan-hoeck/idris2-pack.git \
            /tmp/idris2-pack
          cd /tmp/idris2-pack
          make micropack SCHEME=scheme
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH"
          export PATH
          rm -rf /tmp/idris2-pack
      - name: Build async-kqueue
        run: |
          set -euxo pipefail
          PATH="$HOME/.local/bin:$PATH"
          export PATH
          pack --no-prompt cleanbuild
      - name: Build tests
        run: |
          set -euxo pipefail
          PATH="$HOME/.local/bin:$PATH"
          export PATH
          cd test
          pack --no-prompt cleanbuild
      - name: Run tests
        run: |
          set -euxo pipefail
          PATH="$HOME/.local/bin:$PATH"
          export PATH
          cd test
          DYLD_LIBRARY_PATH="$(pack libs-path)"
          export DYLD_LIBRARY_PATH
          echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH"
          pack run

  freebsd:
    name: FreeBSD / Idris2 latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          arch: x86_64
          mem: 8192
          sync: rsync
          copyback: false
          usesh: true
          prepare: |
            set -eux
            pkg install -y \
              bash \
              curl \
              git \
              gmake \
              gmp \
              lang/gcc
            ln -sf /usr/local/bin/gmake /usr/local/bin/make
            PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
            export PATH
            CPPFLAGS="-I/usr/local/include"
            CFLAGS="-I/usr/local/include"
            LDFLAGS="-L/usr/local/lib"
            export CPPFLAGS
            export CFLAGS
            export LDFLAGS
            command -v cc
            cc --version
            command -v ld.lld
            ld.lld --version
            command -v gmake
            gmake --version
            uname -a
            uname -m
            git clone --depth=1 \
              https://github.com/cisco/ChezScheme.git \
              /tmp/ChezScheme
            cd /tmp/ChezScheme
            ./configure \
              --threads \
              --disable-x11 \
              --installprefix="$HOME/.local"
            gmake -j"$(sysctl -n hw.ncpu)"
            gmake install
            PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            export PATH
            command -v scheme
            scheme --version
            git clone --depth=1 \
              https://github.com/stefan-hoeck/idris2-pack.git \
              /tmp/idris2-pack
            cd /tmp/idris2-pack
            gmake micropack SCHEME=scheme
            PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            export PATH
            command -v idris2
            idris2 --version
            command -v pack
            pack help >/dev/null
            rm -rf /tmp/ChezScheme
            rm -rf /tmp/idris2-pack
          run: |
            set -eux
            PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            export PATH
            command -v scheme
            scheme --version
            command -v idris2
            idris2 --version
            command -v pack
            command -v cc
            cc --version
            command -v ld.lld
            ld.lld --version
            pack --no-prompt cleanbuild
            cd test
            pack --no-prompt cleanbuild
            LD_LIBRARY_PATH="$(pack libs-path)"
            export LD_LIBRARY_PATH
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            pack run
