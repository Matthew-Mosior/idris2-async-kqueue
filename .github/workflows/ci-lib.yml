---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS / Idris2 latest
    runs-on: macos-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install chezscheme coreutils gmp

      - name: Install pack
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/stefan-hoeck/idris2-pack/main/install.bash)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build async-kqueue
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pack --no-prompt install async-kqueue

      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd test
          pack --no-prompt cleanbuild
          pack run

  netbsd:
    name: NetBSD / Idris2 latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.0"
          arch: x86_64
          usesh: true
          mem: 8192
          sync: rsync
          copyback: false
          prepare: |
            PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/$(uname -r | cut -d_ -f1)/All"
            export PKG_PATH
            pkg_add pkgin
            pkgin -y install \
              bash \
              coreutils \
              curl \
              git \
              gmake \
              gmp \
              llvm \
              clang \
              lld \
              ncurses \
              libiconv
            # Idris2 and pack invoke `make`, while NetBSD's system make is BSD make.
            ln -sf /usr/pkg/bin/gmake /usr/pkg/bin/make
            ln -sf /usr/pkg/bin/gbasename /usr/pkg/bin/basename
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            mkdir -p /tmp/netbsd-sets
            curl -fL \
              https://cdn.NetBSD.org/pub/NetBSD/NetBSD-10.0/amd64/binary/sets/xbase.tar.xz \
              -o /tmp/netbsd-sets/xbase.tar.xz
            curl -fL \
              https://cdn.NetBSD.org/pub/NetBSD/NetBSD-10.0/amd64/binary/sets/xcomp.tar.xz \
              -o /tmp/netbsd-sets/xcomp.tar.xz
            tar -C / -xJf /tmp/netbsd-sets/xbase.tar.xz
            tar -C / -xJf /tmp/netbsd-sets/xcomp.tar.xz
            test -f /usr/X11R7/include/X11/Xlib.h
            test -f /usr/X11R7/lib/libX11.so
            command -v make
            make --version
            command -v clang
            clang --version
            git clone --depth=1 \
              https://github.com/cisco/ChezScheme.git \
              /tmp/ChezScheme
            cd /tmp/ChezScheme
            CC=clang \
              CFLAGS="-I/usr/X11R7/include" \
              LDFLAGS="-L/usr/X11R7/lib -Wl,-R/usr/X11R7/lib" \
              ./configure \
                --threads \
                --installprefix=/usr/pkg
            make CC=clang
            make install
            command -v scheme
            scheme --version
          run: |
            set -eux
            export PATH="$HOME/.local/bin:/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            export CPPFLAGS="-I/usr/pkg/include"
            export CFLAGS="-I/usr/pkg/include"
            export LDFLAGS="-L/usr/pkg/lib -Wl,-R/usr/pkg/lib"
            curl -fsSL \
              https://raw.githubusercontent.com/stefan-hoeck/idris2-pack/main/install.bash \
              -o /tmp/install-pack.sh
            # `pack info` eagerly scans/caches the entire package collection.
            # We do not need that during CI bootstrap.
            sed -i \
              's|"$BIN_DIR/pack" info|true # skip pack info cache warmup in CI|' \
              /tmp/install-pack.sh
            printf 'scheme\n' | bash /tmp/install-pack.sh
            # Clear transient/corruptible git state.
            rm -rf "$HOME/.cache/pack/git"
            rm -rf "$HOME/.cache/pack/.tmp"*
            # NetBSD exposes the POSIX mode macros through <sys/stat.h>.
            # idris2-linux's flags generator does not include it, and its
            # Makefile directly invokes `cc` without CFLAGS/CPPFLAGS.
            mkdir -p /tmp/ci-bin
            cat >/tmp/ci-bin/cc <<'EOF'
            #!/bin/sh
            case " $* " in
              *" flags.c "*)
                exec /usr/pkg/bin/clang -include sys/stat.h "$@"
                ;;
              *)
                exec /usr/pkg/bin/clang "$@"
                ;;
            esac
            EOF
            chmod +x /tmp/ci-bin/cc
            export PATH="/tmp/ci-bin:$HOME/.local/bin:/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            command -v cc
            cc --version
            pack --no-prompt install async-kqueue
            cd test
            pack --no-prompt cleanbuild
            export LD_LIBRARY_PATH="$(pack libs-path)"
            pack run
